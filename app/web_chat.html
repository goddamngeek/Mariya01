<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Алексей</title>
<style>
  :root {
    --bg: #f2f2f7; --panel: #fff; --ink: #11131a; --dim: #6b7280;
    --bot: #fff; --me: #2f6fed; --me-ink: #fff; --line: #e3e5ea;
    --btn: #f4f5f8; --btn-ink: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e8eaf0; --dim: #8b93a3;
      --bot: #1c2029; --me: #3d7bff; --me-ink: #fff; --line: #262b36;
      --btn: #232935; --btn-ink: #7aa5ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    font-weight: 600; display: flex; justify-content: space-between; align-items: baseline;
  }
  header small { font-weight: 400; color: var(--dim); font-size: 13px; }
  #feed { flex: 1; overflow-y: auto; padding: 14px 12px 4px; }
  .msg { max-width: 84%; margin: 0 0 10px; }
  .msg.bot { margin-right: auto; }
  .msg.user { margin-left: auto; }
  .bubble {
    padding: 9px 13px; border-radius: 18px; white-space: normal; overflow-wrap: anywhere;
  }
  .bot .bubble { background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .user .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 5px; }
  .bubble pre { white-space: pre-wrap; margin: 6px 0; font-size: 14px; }
  .bubble code { font-size: 90%; }
  .bubble a { color: inherit; }
  .meta { font-size: 11px; color: var(--dim); margin: 3px 6px 0; }
  .user .meta { text-align: right; }
  .gone .bubble { opacity: .45; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .buttons button {
    font: inherit; font-size: 14px; padding: 7px 13px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--btn); color: var(--btn-ink); cursor: pointer;
  }
  .buttons button:disabled { opacity: .4; cursor: default; }
  footer {
    display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #text {
    flex: 1; font: inherit; padding: 10px 14px; border-radius: 20px; resize: none;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-height: 120px;
  }
  #send {
    font: inherit; padding: 0 18px; border: 0; border-radius: 20px;
    background: var(--me); color: var(--me-ink); cursor: pointer;
  }
  #send:disabled { opacity: .4; }
  #note { padding: 10px 16px; color: var(--dim); font-size: 13px; text-align: center; }
</style>

<header><span>Алексей</span><small id="who">—</small></header>
<div id="feed"></div>
<div id="note" hidden></div>
<footer>
  <textarea id="text" rows="1" placeholder="Написать…" autocomplete="off"></textarea>
  <button id="send">→</button>
</footer>

<script>
const feed = document.getElementById("feed");
const note = document.getElementById("note");
const box = document.getElementById("text");
const sendBtn = document.getElementById("send");
const seen = new Map();
let after = 0, since = null, polling = false;

const atBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;

function say(msg) { note.textContent = msg; note.hidden = !msg; }

function time(iso) {
  const d = new Date(iso), now = new Date();
  const t = d.toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === now.toDateString()
    ? t : d.toLocaleDateString("ru", { day: "numeric", month: "short" }) + ", " + t;
}

function draw(m) {
  let el = seen.get(m.id);
  if (!el) {
    el = document.createElement("div");
    el.dataset.id = m.id;
    seen.set(m.id, el);
    // Журнал приходит по возрастанию id, но правки старых строк приезжают
    // вперемешку — вставляем на место, а не в конец.
    const next = [...feed.children].find(c => +c.dataset.id > m.id);
    feed.insertBefore(el, next || null);
  }
  el.className = "msg " + m.author + (m.deleted ? " gone" : "");
  const marks = [time(m.at)];
  if (m.edited) marks.push("изменено");
  if (m.deleted) marks.push("удалено в телеграме");
  el.innerHTML = '<div class="bubble"></div><div class="meta"></div>';
  el.querySelector(".bubble").innerHTML = m.html;
  el.querySelector(".meta").textContent = marks.join(" · ");
  if (m.buttons && m.buttons.length) {
    const row = document.createElement("div");
    row.className = "buttons";
    for (const b of m.buttons) {
      const btn = document.createElement("button");
      btn.textContent = b.label;
      btn.onclick = async () => {
        [...row.children].forEach(c => c.disabled = true);
        try {
          const r = await fetch("/w/api/press", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: m.id, data: b.data }),
          });
          if (!r.ok) throw new Error(await r.text());
          poll();
        } catch (e) {
          say("не отправилось: " + e.message);
          [...row.children].forEach(c => c.disabled = false);
        }
      };
      row.appendChild(btn);
    }
    el.appendChild(row);
  }
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    const q = new URLSearchParams({ after });
    if (since) q.set("since", since);
    const r = await fetch("/w/api/messages?" + q);
    if (r.status === 401) { say("Нужен токен — открой ссылку с ?t=…"); return; }
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    document.getElementById("who").textContent = d.person;
    const stick = atBottom();
    for (const m of d.messages) { draw(m); if (m.id > after) after = m.id; }
    since = d.now;
    if (stick && d.messages.length) feed.scrollTop = feed.scrollHeight;
    say("");
  } catch (e) {
    say("нет связи с ботом");
  } finally {
    polling = false;
  }
}

async function send() {
  const text = box.value.trim();
  if (!text) return;
  box.value = ""; box.style.height = "auto"; sendBtn.disabled = true;
  try {
    const r = await fetch("/w/api/say", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) throw new Error(await r.text());
    await poll();
    feed.scrollTop = feed.scrollHeight;
  } catch (e) {
    box.value = text;
    say("не отправилось: " + e.message);
  } finally {
    sendBtn.disabled = false;
    box.focus();
  }
}

sendBtn.onclick = send;
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 120) + "px";
});
box.addEventListener("keydown", e => {
  // Enter отправляет только с настоящей клавиатуры: на телефоне это перевод
  // строки, иначе половина сообщений уходит недописанными.
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) {
    e.preventDefault(); send();
  }
});

poll();
setInterval(poll, 2500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
